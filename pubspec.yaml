name: tamitu
description: "Tamitu - AI travel planner (TadeCode)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0
  # Pinned Flutter version (ADR-0008); keep in sync with README.md and CI.
  flutter: 3.50.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.1
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  uuid: ^4.6.0
  hugeicons: ^4.4.0
  flutter_svg: ^2.4.0
  firebase_core: ^5.2.0
  firebase_auth: ^7.1.0
  cloud_functions: ^7.1.0
  google_sign_in: ^7.2.0
  drift: ^2.35.4
  flutter_secure_storage: ^11.2.0
  path_provider: ^2.1.6
  firebase_app_check: ^0.5.2
  crypto: ^3.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  shared_preferences_platform_interface: ^2.4.2

flutter:
  uses-material-design: true
  generate: true
  assets:
    # EK-02 illustration v0.5 (UX-ICON): light = day, dark = night.
    - assets/images/ek-02-illustration-light.svg
    - assets/images/ek-02-illustration-dark.svg
  # Plain `flutter build apk` (CI) builds the dev flavor.
  default-flavor: dev

# ADR-0005 / ADR-0008: SQLCipher build of SQLite for the encrypted account database
# (package:sqlite3 hook option; binaries are checked against sha256 pinned in the package).
hooks:
  user_defines:
    sqlite3:
      source: sqlcipher
