name: tamitu
description: "Tamitu - AI travel planner (TadeCode)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0
  # Pinned Flutter version (ADR-0008); keep in sync with README.md and CI.
  flutter: 3.50.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  uuid: ^4.6.0
  hugeicons: ^4.4.0
  flutter_svg: ^2.4.0
  firebase_core: ^5.2.0
  firebase_auth: ^7.1.0
  cloud_functions: ^7.1.0
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  shared_preferences_platform_interface: ^2.4.2

flutter:
  uses-material-design: true
  generate: true
  # Plain `flutter build apk` (CI) builds the dev flavor.
  default-flavor: dev
