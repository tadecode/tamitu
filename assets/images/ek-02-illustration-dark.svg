<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" aria-hidden="true" focusable="false">
  <!-- EK-02 decorative illustration "here and there" (dark theme: night sky with stars, moon over the sea, lit windows and lighthouse). Generic place, no text, no filters, no masks,
       no external references. Key content inside x 150-1050, y 50-350 (survives cover-crop at 144/96 dp). Corners rounded by the widget (shape-l). -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0D2930"/><stop offset=".55" stop-color="#17414A"/><stop offset="1" stop-color="#2D5F60"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1C5759"/><stop offset="1" stop-color="#0A2E33"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2=".4" y2="1">
      <stop offset="0" stop-color="#2E6655"/><stop offset="1" stop-color="#1C463D"/>
    </linearGradient>
    <linearGradient id="isle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B6152"/><stop offset="1" stop-color="#1B4239"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FFE6B0" stop-opacity=".75"/><stop offset="1" stop-color="#FFE6B0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#sky)"/>
  <!-- stars -->
  <g fill="#FFF1C9">
    <circle cx="180" cy="70" r="3"/><circle cx="262" cy="118" r="2"/><circle cx="350" cy="58" r="3.5"/><circle cx="470" cy="96" r="2"/>
    <circle cx="560" cy="52" r="3"/><circle cx="650" cy="110" r="2"/><circle cx="790" cy="64" r="3.5"/><circle cx="880" cy="120" r="2"/>
    <circle cx="960" cy="58" r="3"/><circle cx="1060" cy="96" r="2"/><circle cx="110" cy="140" r="2"/><circle cx="1130" cy="60" r="2.5"/>
  </g>
  <!-- sun / moon low over the sea -->
  <circle cx="700" cy="226" r="120" fill="url(#glow)"/>
  <circle cx="700" cy="226" r="46" fill="#FFE6B0"/>
  <!-- clouds -->
  <g fill="#244E56">
    <circle cx="372" cy="150" r="18"/><circle cx="398" cy="138" r="24"/><circle cx="428" cy="150" r="17"/><rect x="354" y="146" width="92" height="22" rx="11"/>
    <circle cx="880" cy="96" r="15"/><circle cx="902" cy="86" r="21"/><circle cx="928" cy="97" r="14"/><rect x="866" y="93" width="76" height="18" rx="9"/>
  </g>
  <!-- far hills -->
  <path d="M0 236C80 200 170 196 260 220C330 204 430 214 540 252H0Z" fill="#1F4746"/>
  <path d="M950 252C1020 214 1110 206 1200 222V252Z" fill="#1F4746"/>
  <!-- sea -->
  <path d="M0 250H1200V400H0Z" fill="url(#sea)"/>
  <path d="M652 266h96M672 282h56M688 298h24" fill="none" stroke="#C9B98F" stroke-width="6" stroke-linecap="round"/>
  <path d="M480 340q15-10 30 0t30 0M610 360q15-10 30 0t30 0M720 322q12-8 24 0t24 0" fill="none" stroke="#35716F" stroke-width="5" stroke-linecap="round"/>
  <!-- sailboat -->
  <path d="M560 296V230" stroke="#6E3426" stroke-width="4" stroke-linecap="round"/>
  <path d="M564 236L604 292H564Z" fill="#D6E2DE"/>
  <path d="M556 248L530 292H556Z" fill="#E3B5A5"/>
  <path d="M520 298H604L590 318H534Z" fill="#9A4A37"/>
  <!-- there: island with lighthouse -->
  <path d="M1004 152L1200 108V196Z" fill="#FFE08A" opacity=".16"/>
  <path d="M984 282L992 170H1016L1024 282Z" fill="#D8CCBA"/>
  <path d="M987 226H1021L1023 250H985Z" fill="#9A4A37"/>
  <rect x="988" y="150" width="32" height="20" rx="4" fill="#FFE08A"/>
  <path d="M982 152L1004 132L1026 152Z" fill="#6E3426"/>
  <path d="M790 400C810 340 880 278 980 270C1070 262 1150 270 1200 288V400Z" fill="url(#isle)"/>
  <!-- here: hill with a house and a tree -->
  <path d="M0 206C70 190 160 192 240 204C330 220 400 262 450 320C470 345 480 372 486 400H0Z" fill="url(#hill)"/>
  <rect x="164" y="170" width="8" height="40" rx="4" fill="#4E3A2D"/>
  <circle cx="168" cy="160" r="24" fill="#245A4B"/><circle cx="152" cy="176" r="15" fill="#1C4B3E"/>
  <rect x="210" y="160" width="70" height="52" fill="#D2C2AC"/>
  <path d="M200 164L245 128L290 164Z" fill="#9A4A37"/>
  <rect x="219" y="174" width="15" height="15" rx="3" fill="#FFD27F"/>
  <rect x="252" y="180" width="16" height="32" rx="8" fill="#5C2C1E"/>
  <path d="M0 330C80 300 180 310 260 350C300 370 320 386 330 400H0Z" fill="#163A33"/>
  <g fill="#C98A78"><circle cx="70" cy="340" r="5"/><circle cx="118" cy="352" r="4"/><circle cx="180" cy="346" r="5"/><circle cx="226" cy="366" r="4"/></g>
  <!-- the route from here to there (brand mark motif) -->
  <path d="M296 204C440 80 730 70 870 244" fill="none" stroke="#80D5D4" stroke-width="6" stroke-dasharray="18 14" stroke-linecap="round"/>
  <circle cx="296" cy="204" r="9" fill="#80D5D4"/>
  <g transform="translate(900 278) scale(1.8) translate(-48 -43)">
    <path d="M48 8c-7.18 0-13 5.82-13 13 0 9.2 13 22 13 22s13-12.8 13-22C61 13.82 55.18 8 48 8Z" fill="#FFB5A0"/>
    <circle cx="48" cy="21" r="4.5" fill="#561F0F"/>
  </g>
  <!-- birds -->
  <path d="M960 176q10-9 20 0 10-9 20 0M1012 154q8-7 16 0 8-7 16 0" fill="none" stroke="#9CC9C4" stroke-width="4" stroke-linecap="round"/>
</svg>
