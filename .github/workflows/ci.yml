name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  farm-guards:
    name: farm-guards
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Skrypty .ps1 mają BOM (inaczej psują polskie znaki)
        shell: powershell
        run: |
          $bad = @()
          Get-ChildItem -Recurse -Filter *.ps1 -File | ForEach-Object {
            $b = [IO.File]::ReadAllBytes($_.FullName)
            if ($b.Length -lt 3 -or $b[0] -ne 0xEF -or $b[1] -ne 0xBB -or $b[2] -ne 0xBF) { $bad += $_.FullName }
          }
          if ($bad) { $bad | ForEach-Object { Write-Error "Brak BOM: $_" }; exit 1 }
      - name: Samotest hooków (granice agentów)
        shell: powershell
        run: .farm/hooks/test-guards.ps1

  conventions:
    name: conventions
    runs-on: ubuntu-latest
    steps:
      - name: Nazwa gałęzi (feat|fix|docs|chore)/<id>
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if ! echo "$HEAD_REF" | grep -Eq '^((feat|fix|docs|chore)/[A-Za-z0-9._-]+|dependabot/[A-Za-z0-9._/-]+)$'; then
            echo "::error::Nazwa gałęzi '$HEAD_REF' nie pasuje do wzorca (feat|fix|docs|chore)/<id-zadania> ani dependabot/<...>"
            exit 1
          fi

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  flutter:
    name: flutter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Czy to projekt Flutter i czy zmiana go dotyczy?
        id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ ! -f pubspec.yaml ]; then
            echo "Brak pubspec.yaml - krok pominięty (szkielet jeszcze nie powstał)."
          elif [ -n "$BASE_SHA" ] && ! git diff --name-only --no-renames "$BASE_SHA" HEAD | grep -Ev '^(backend/|docs/|\.farm/|\.claude/)|\.md$' | grep -q .; then
            # --no-renames: przeniesienie pliku pokazuje starą i nową ścieżkę (np. lib/a.dart -> docs/ nie pominie buildu).
            echo "PR zmienia tylko backend/, dokumentację lub pliki farmy - testy Fluttera pominięte (kontrola nadal zgłasza sukces)."
          else
            echo "flutter=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: subosito/flutter-action@v2
        if: steps.detect.outputs.flutter == 'true'
        with:
          channel: stable
          cache: true
      - name: Zależności
        if: steps.detect.outputs.flutter == 'true'
        run: flutter pub get
      - name: Format kodu (sprawdzenie, bez zmian)
        if: steps.detect.outputs.flutter == 'true'
        run: dart format --output=none --set-exit-if-changed .
      - name: Analiza statyczna
        if: steps.detect.outputs.flutter == 'true'
        run: flutter analyze
      - name: Testy
        if: steps.detect.outputs.flutter == 'true'
        run: flutter test
      - name: Build APK (debug) - czy się składa
        if: steps.detect.outputs.flutter == 'true'
        run: flutter build apk --debug -P tamitu.allowMissingGoogleServices=true

  backend:
    name: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Czy istnieje backend?
        id: detect
        run: |
          if [ -f backend/functions/package.json ]; then echo "backend=true" >> "$GITHUB_OUTPUT"; else echo "Brak backend/functions/package.json - kroki pominięte (backend jeszcze nie powstał)."; fi
      - uses: actions/setup-node@v7
        if: steps.detect.outputs.backend == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/functions/package-lock.json
      - name: Zależności
        if: steps.detect.outputs.backend == 'true'
        working-directory: backend/functions
        run: npm ci
      - name: Lint
        if: steps.detect.outputs.backend == 'true'
        working-directory: backend/functions
        run: npm run lint
      - name: Testy jednostkowe (vitest)
        if: steps.detect.outputs.backend == 'true'
        working-directory: backend/functions
        run: npx vitest run
      - uses: actions/setup-java@v5
        if: steps.detect.outputs.backend == 'true'
        with:
          distribution: temurin
          java-version: 21
      - name: Testy reguł Firestore w emulatorze
        if: steps.detect.outputs.backend == 'true'
        working-directory: backend/functions
        run: |
          # Wymaga skryptu `test:rules` i lokalnego `firebase-tools` (devDependency); bez skryptu krok jest pomijany.
          if npm pkg get scripts.test:rules | grep -q '"'; then
            npx --no-install firebase emulators:exec --config ../firebase.json --only firestore "npm run test:rules"
          else
            echo "Brak skryptu test:rules - pominięto."
          fi
