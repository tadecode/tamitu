name: deploy

# Reczne wdrozenie backendu do Firebase DEV przez Workload Identity Federation (GH-010).
# Bez kluczy JSON (organizacja GCP blokuje ich tworzenie). Tylko projekt dev, tylko z gałęzi main.
# Prod: osobna prosba po probie w dev i zawezeniu rol ci-deployer (SEC-17, W-4, Ś-3, W-5).
#
# Zmienne Actions (nie sekrety): GCP_WIF_PROVIDER_DEV, GCP_DEPLOYER_SA_DEV.
# Warunek pul WIF (GCP): repository_id + repository_owner_id + ref == refs/heads/main.

on:
  workflow_dispatch:
    inputs:
      component:
        description: "Co wdrozyc w projekcie dev"
        type: choice
        required: true
        options:
          - firestore:rules
          - firestore:indexes
          - functions

permissions:
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy-dev:
    name: deploy-dev
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # id-token tylko w jobie wdrozeniowym.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Uwierzytelnienie w GCP (WIF)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER_DEV }}
          service_account: ${{ vars.GCP_DEPLOYER_SA_DEV }}
      - name: Wdrozenie
        working-directory: backend
        env:
          COMPONENT: ${{ inputs.component }}
        run: npx --yes firebase-tools@15.34.2 deploy --only "$COMPONENT" --project=tamitu-dev-tadecode --non-interactive
