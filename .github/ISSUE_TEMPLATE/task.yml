name: Zadanie (backlog)
description: Zadanie dla roli agenta (zadania farmy są w Azure Boards; ten szablon tylko wyjątkowo)
title: "T-<id>: <tytuł>"
labels: ["task"]
body:
  - type: input
    id: role
    attributes:
      label: Rola odpowiedzialna
      description: analyst / architect / security / mobile-dev / qa
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Cel
    validations:
      required: true
  - type: textarea
    id: inputs
    attributes:
      label: Wejścia (pliki do przeczytania)
  - type: textarea
    id: dod
    attributes:
      label: Definicja ukończenia
      description: Kryteria akceptacji (Given/When/Then) lub lista kontrolna
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Ograniczenia
      description: Zakres uprawnień, koszty, dane osobowe
