name: Błąd
description: Zgłoszenie błędu (np. z raportu QA)
title: "BUG: <skrót>"
labels: ["bug"]
body:
  - type: textarea
    id: steps
    attributes:
      label: Kroki odtworzenia
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Oczekiwane / faktyczne zachowanie
    validations:
      required: true
  - type: input
    id: story
    attributes:
      label: Powiązana historyjka (US-<id>)
  - type: dropdown
    id: severity
    attributes:
      label: Waga
      options: [bloker, wysoka, średnia, niska]
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Prywatność
      options:
        - label: Błąd dotyczy danych osobowych lub uprawnień (wymaga przeglądu security)
